name: Build Docker images


on:

  push:
    branches:
      - "master"

  schedule:
    - cron: "0 3 * * 2"
    - cron: "0 3 * * 5"

  workflow_dispatch:


jobs:

  build_and_publish_nginx:
    name: Build and publish Docker image to Docker Hub
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "master"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for version extraction (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: eworkssk/nginx:version-extract

      - name: Extract nginx version
        run: |
          NGINX_VERSION=$(docker run --rm eworkssk/nginx:version-extract nginx -v 2>&1 | grep -oP '(?<=nginx/)\S+')
          MAJOR_MINOR=$(echo "$NGINX_VERSION" | grep -oP '^\d+\.\d+')
          echo "NGINX_VERSION=${NGINX_VERSION}" >> $GITHUB_ENV
          echo "MAJOR_MINOR=${MAJOR_MINOR}" >> $GITHUB_ENV

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            eworkssk/nginx:latest
            eworkssk/nginx:${{ env.MAJOR_MINOR }}
            eworkssk/nginx:${{ env.NGINX_VERSION }}
            ghcr.io/eworkssk/nginx:latest
            ghcr.io/eworkssk/nginx:${{ env.MAJOR_MINOR }}
            ghcr.io/eworkssk/nginx:${{ env.NGINX_VERSION }}
